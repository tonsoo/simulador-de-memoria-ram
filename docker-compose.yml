services:
  app:
    build:
      context: docker
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./scripts/build.sh:/usr/local/bin/build
      - /tmp/.X11-unix:/tmp/.X11-unix
    restart: on-failure
    network_mode: "host"
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}